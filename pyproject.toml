[tool.poetry]
name = "tokopaedi-async"
version = "0.2.0"
description = "High-performance, serverless-safe async Python scraper for Tokopedia"
authors = ["pandamoon21 <pandamoon21@waifu.club>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "tokopaedi_async", from = "src" }]
include = ["LICENSE"]

homepage = "https://github.com/pandamoon21/tokopaedi-async"
repository = "https://github.com/pandamoon21/tokopaedi-async"
documentation = "https://github.com/pandamoon21/tokopaedi-async"
keywords = [
    "tokopedia", "scraper", "ecommerce", "product", "data",
    "web-scraping", "python", "data-analysis", "tokopedia-reviews",
    "async", "asyncio", "serverless", "vercel", "lambda",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = ">=3.9, <4.0"
curl-cffi = ">=0.11.4"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
fastapi = ">=0.110"
uvicorn = ">=0.27"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"